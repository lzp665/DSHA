name: Build accessibility-fix APK (arm64)

# 只用于本分支：把「无障碍一进设置就掉」的修复打成可直接安装的 release APK。
# 签名使用固定测试密钥（committed at ci/a11y-fix-test.keystore），
# 因此与官方 APK 签名不同，不能覆盖安装官方版本（需先卸载）。
on:
  workflow_dispatch:
    inputs:
      asset_bundle_url:
        description: locked-inputs.zip 的 Release 下载地址
        required: false
        default: https://github.com/lzp665/DSHA/releases/download/a11y-inputs/locked-inputs.zip
      asset_bundle_sha256:
        description: 该输入包的固定 SHA-256
        required: false
        default: 57b384627c016393dc68fbdfa63813ca0d0520c632de875eae6cd2e6f7382d90
  push:
    branches: [ a11y-fix ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: true

      - name: Verify toolchain against source configuration
        id: toolchain
        run: python3 tools/ci-toolchain.py --github-output

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.toolchain.outputs.node }}

      - name: Android SDK
        run: |
          # runner 上 sdkmanager 不在 PATH；ANDROID_HOME 由 runner 镜像导出。
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK_ROOT=$SDK_ROOT"
          SDKMANAGER="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          test -n "$SDKMANAGER" || SDKMANAGER="$(command -v sdkmanager)"
          echo "SDKMANAGER=$SDKMANAGER"
          platform=$(python3 tools/ci-toolchain.py --field androidPlatform)
          buildtools=$(python3 tools/ci-toolchain.py --field buildTools)
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;$platform" "build-tools;$buildtools" "platform-tools"
          # 让后续 Gradle 用同一套 SDK 和已许可组件。
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDK_ROOT"/build-tools/"$buildtools"/aapt2 version

      - name: Restore exact offline inputs
        env:
          # push 触发时 inputs 为空，回退到本仓库默认的 Release 输入包。
          INPUT_URL: ${{ inputs.asset_bundle_url || 'https://github.com/lzp665/DSHA/releases/download/a11y-inputs/locked-inputs.zip' }}
          INPUT_SHA: ${{ inputs.asset_bundle_sha256 || '57b384627c016393dc68fbdfa63813ca0d0520c632de875eae6cd2e6f7382d90' }}
        run: |
          # git 不跟踪 .bin 大文件；先按官方 ci-assets 约定从 Release 还原到项目路径。
          python3 tools/ci-assets.py --url "$INPUT_URL" --sha256 "$INPUT_SHA"
          ls -la app/src/main/assets/*.bin tools/recovery-runtime/archives/ 2>/dev/null

      - name: Host runtime descriptor and backup proofs
        run: |
          python3 tools/prepare-runtime-descriptor.py --check
          python3 -B tools/prepare-backup-assets.py --check

      - name: Accessibility unit tests
        run: |
          ./gradlew --no-daemon :app:testStandardDebugUnitTest \
            --tests "com.deepseekharness.app.util.Accessibility*" \
            -Dfile.encoding=UTF-8

      - name: Assemble signed standard release
        env:
          DSHA_KEYSTORE: ${{ github.workspace }}/ci/a11y-fix-test.keystore
          DSHA_KEYSTORE_PASSWORD: dsha-a11y-fix
          DSHA_KEY_PASSWORD: dsha-a11y-fix
          DSHA_KEY_ALIAS: dsha-a11y-fix
        run: |
          ./gradlew --no-daemon :app:assembleStandardRelease

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p out
          find app/build/outputs/apk -name "*.apk" -exec cp -v {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsha-a11y-fix
          path: out/*.apk
          if-no-files-found: warn
